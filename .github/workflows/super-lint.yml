name: Super-Lint

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter@47984f49b4e87383eed97890fe2dca6063bbd9c3 # v8.3.1
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          FIX_CSS: true
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_JAVASCRIPT_ES: false # No need since we have typescript es
          VALIDATE_JAVASCRIPT_STANDARD: false # No need since we have other linters, uses too much memory
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_SQLFLUFF: false # No need since we use orm
          VALIDATE_BIOME_FORMAT: false # Prettier is the formatter
          VALIDATE_BIOME_LINT: false # ESLint is the linter
          VALIDATE_TSX: false # `yarn lint` runs ESLint with the workspace config
          VALIDATE_TYPESCRIPT_ES: false # same as above

      - name: Commit and push linting fixes
        # Run only on:
        # - Pull requests
        # - Not on the default branch
        if: >
          github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit_message: "chore: fix linting issues"
          commit_user_name: super-linter
          commit_user_email: super-linter@super-linter.dev
