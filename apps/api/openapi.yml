    CreateConversionRuleDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - stage_to_stage
            - stage_to_tournament
            - tournament_to_tournament
          description: 'What source and destination are: stage_to_stage,
            stage_to_tournament or tournament_to_tournament'
        strategy:
          type: string
          enum:
            - qualification
            - ranking
            - elimination
            - hybrid
            - seed
            - tie_breaker
            - qualification_with_lcq
          description:
            'ranking: points by place. qualification: places in range get an
            entry in the destination. elimination: qualification that also
            removes the other entries from the destination stage. seed:
            qualification in order of place. hybrid: qualification plus ranking
            points'
        source:
          type: number
          description: ID of the stage or tournament whose placings are converted
        destination:
          type: number
          description: ID of the stage or tournament that receives them
        points:
          type: number
          description: Points for every place in range, when maxPoints is not set
        from:
          type: number
          description: First place in range (default 1)
        to:
          type: number
          description: 'Last place in range (default: the last place)'
        maxPoints:
          type: number
          description: Points for the first place in range
        minPoints:
          type: number
          description: Fewest points a place in range gets (default 0)
        pointsPerPlace:
          type: number
          description: Points fewer for each place after the first
      required:
        - type
        - strategy
        - source
        - destination
