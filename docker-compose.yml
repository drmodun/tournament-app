# Local stack: PostGIS, API, web and docs behind a Caddy reverse proxy, plus a mail inbox and S3 storage.
#
#   docker compose up --build                     # everything; open http://localhost (docs at http://localhost/docs/)
#   docker compose --profile seed run --rm seed   # wipe and fill the database with sample data
#   docker compose --profile tools up --build     # also start the dormant admin app
#   docker compose up -d db                       # just the database, for `yarn dev` and the test suites
#
# Host ports can be moved when they are taken: PROXY_HTTP_PORT (80), PROXY_HTTPS_PORT (443), DB_PORT (5433),
# API_HOST_PORT (5500), WEB_PORT (3000), DOCS_PORT (4321), MAIL_UI_PORT (8025), MAIL_SMTP_PORT (1025), S3_PORT (8333).
# PUBLIC_URL is the address people open (default http://localhost:<PROXY_HTTP_PORT>). The web image is built
# to call the API at <PUBLIC_URL>/api, and email links use it. Set it together with SITE_ADDRESS for a real domain:
#   SITE_ADDRESS=example.com PUBLIC_URL=https://example.com docker compose up --build

x-api-env: &api-env
  DATABASE_URL: postgres://postgres:postgres@db:5432/tournament
  API_PORT: "5500"
  # Outgoing mail lands in the Mailpit inbox unless a real SMTP server is configured
  SMTP_HOST: ${SMTP_HOST:-mail}
  SMTP_PORT: ${SMTP_PORT:-1025}
  S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://s3:8333}
  # Links in emails point at the proxy
  FRONTEND_URL: ${PUBLIC_URL:-http://localhost:${PROXY_HTTP_PORT:-80}}

services:
  # Reverse proxy: the single entry point. Configuration in docker/caddy/Caddyfile.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - docs

  # Catches every email the API sends; read them at http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"
      - "${MAIL_SMTP_PORT:-1025}:1025"

  # S3-compatible object storage (SeaweedFS, Apache 2.0). Credentials in docker/s3/s3.json.
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.port=8333",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-volume.max=20",
        "-master.volumeSizeLimitMB=128",
      ]
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3_data:/data
      - ./docker/s3/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && nc -z 127.0.0.1 8333",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the bucket the API uploads to
  s3-init:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -qw '${S3_BUCKET:-tournament}'
        || echo 's3.bucket.create -name ${S3_BUCKET:-tournament}' | weed shell -master=s3:9333
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tournament
    ports:
      # 5433 on the host so it does not collide with a locally installed Postgres
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/20-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tournament"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: &api-build
      context: .
      dockerfile: ./apps/api/Dockerfile
    image: tournament-app-api
    command: ["yarn", "migrate"]
    env_file: .env
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Destructive: the seed script empties every table first, so it only runs on request.
  seed:
    build: *api-build
    image: tournament-app-api
    profiles: ["seed"]
    command: ["yarn", "seed"]
    env_file: .env
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: *api-build
    image: tournament-app-api
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    ports:
      - "${API_HOST_PORT:-5500}:5500"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5500/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        # Inlined into the browser bundle, so this must be the URL the browser can reach
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${PUBLIC_URL:-http://localhost:${PROXY_HTTP_PORT:-80}}/api}
        # Optional: your own Photon geocoder and MapLibre styles (defaults: photon.komoot.io, OpenFreeMap)
        NEXT_PUBLIC_GEOCODER_URL: ${NEXT_PUBLIC_GEOCODER_URL:-}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_MAP_STYLE_URL_DARK: ${NEXT_PUBLIC_MAP_STYLE_URL_DARK:-}
    image: tournament-app-web
    restart: unless-stopped
    environment:
      # Server-side fetches go straight to the api container
      API_INTERNAL_URL: http://api:5500
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Static documentation site, served at /docs (also published directly on DOCS_PORT)
  docs:
    build:
      context: .
      dockerfile: ./apps/docs/Dockerfile
    image: tournament-app-docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-4321}:4321"

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
    image: tournament-app-admin
    profiles: ["tools"]
    ports:
      - "3001:3001"

volumes:
  db_data:
  s3_data:
  caddy_data:
  caddy_config:
